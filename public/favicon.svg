<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Clip to just the A shape so yellow only shows inside the letter -->
    <clipPath id="a-mask">
      <!-- Outer A triangle minus inner cutout -->
      <path d="M50 4 L4 96 L22 96 L50 30 L78 96 L96 96 Z M50 46 L32 84 L68 84 Z" clip-rule="evenodd"/>
    </clipPath>
  </defs>

  <!-- Red background pill -->
  <rect width="100" height="100" rx="20" fill="#D01515"/>

  <!-- White A -->
  <path d="M50 4 L4 96 L22 96 L50 30 L78 96 L96 96 Z M50 46 L32 84 L68 84 Z"
        fill="white" fill-rule="evenodd"/>

  <!-- Golden yellow band clipped to A shape -->
  <rect x="0" y="58" width="100" height="14" fill="#F5C518" clip-path="url(#a-mask)"/>
</svg>
