<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="a-clip">
      <polygon points="50,8 13,93 28,93 50,35 72,93 87,93"/>
    </clipPath>
  </defs>

  <!-- Red background -->
  <rect width="100" height="100" rx="16" fill="#CC1111"/>

  <!-- White A body -->
  <polygon points="50,8 13,93 28,93 50,35 72,93 87,93" fill="white"/>
  <!-- Center cutout -->
  <polygon points="50,44 36,78 64,78" fill="#CC1111"/>

  <!-- Yellow stripe clipped to A shape only -->
  <rect x="0" y="56" width="100" height="13" fill="#FFD700" clip-path="url(#a-clip)"/>
  <!-- Re-punch center hole through yellow stripe -->
  <polygon points="50,44 36,78 64,78" fill="#CC1111"/>
</svg>
